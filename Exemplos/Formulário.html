<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formulário</title>
</head>
<body>
<h1>Formulário</h1>

<form>
    <label for="input_name">Nome</label>
    <input id="input_name" type="text" placeholder="Lívia" required>
    <br><br>
    <label for="input_email">Email</label>
    <input id="input_email" type="email" placeholder="Lívia@gmail.com" required>
    <br><br>
    <label for="input_senha">Senha</label>
    <input id="input_senha" type="password" placeholder="password" required>
    <br><br>
    <label for="text_descricao">Descrição</label><br>
    <textarea id="text_descricao" cols="10" rows="10"></textarea>
    <br><br>

    <label><strong>Gênero</strong></label><br>
    <input id="radio_m" type="radio" value="Masculino" name="genero">
    <label for="radio_m">masculino</label><br>
    <input id="radio_f" type="radio" value="Feminino" name="genero">
    <label for="radio_f">feminino</label>
    <br><br>

    <label for="menu_cidade">Cidade</label>
    <select id="menu_cidade">
    <optgroup label="Interior">
        <option>Guararapes</option>
        <option>Araçatuba</option>
        <option>Birigui</option>
        <option>Rubiácea</option>
    </optgroup>
    <optgroup label="Capitais">
        <option>São Paulo</option>
        <option>Rio de Janeiro</option>
        <option>Brasília</option>
    </optgroup>

    </select>
    <br><br>
    <button type="submit">Salvar</button>
    <button type="reset">Limpar</button>

</form>
</body>
</html>
