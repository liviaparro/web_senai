<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercício 1</title>

<body>
<form>

    <input id="input_name" type="text" placeholder="Lívia" required>

    <br><br>
    <label for="text_assunto">Assunto</label><br>
    <textarea id="text_assunto" cols="10" rows="10"></textarea>
    <br><br>
    <label for="text_mensagem">Mensagem</label><br>
    <textarea id="text_mensagem" cols="10" rows="10"></textarea><br>
    <button type="submit">Enviar</button>
    <button type="reset">Redefinir</button>
</form>
</body>
</html>
